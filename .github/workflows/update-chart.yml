name: Update Ping Chart

on:
  push:
    paths:
      - 'ping.log'

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install matplotlib

      - name: Generate chart
        run: python plot_ping.py

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping_chart.png
          git diff --staged --quiet || git commit -m "Update ping chart"
          git push
