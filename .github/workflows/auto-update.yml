name: Auto Update Repo

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 4 * * *'   # 04:00 UTC
    - cron: '0 8 * * *'   # 08:00 UTC
    - cron: '0 12 * * *'  # 12:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
    - cron: '0 20 * * *'  # 20:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record latency and update log
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          COUNT_FILE=".run-count"

          # Read today's run count and target from state file
          RUNS_TODAY=0
          TARGET=0
          if [ -f "$COUNT_FILE" ]; then
            stored_date=$(cut -d: -f1 "$COUNT_FILE")
            stored_count=$(cut -d: -f2 "$COUNT_FILE")
            stored_target=$(cut -d: -f3 "$COUNT_FILE")
            if [ "$stored_date" = "$TODAY" ]; then
              RUNS_TODAY=$stored_count
              TARGET=$stored_target
            fi
          fi

          # First run of the day: pick a random target between 2 and 6
          if [ "$RUNS_TODAY" -eq 0 ]; then
            TARGET=$((RANDOM % 5 + 2))
            echo "New day — target: $TARGET runs."
          fi

          # Already hit today's target — bail out
          if [ "$RUNS_TODAY" -ge "$TARGET" ]; then
            echo "Already ran $RUNS_TODAY/$TARGET times today. Skipping."
            exit 0
          fi

          # Ping both hosts (5 packets each, 3s timeout) and extract avg RTT
          LATENCY_8888=$(ping -c 5 -W 3 8.8.8.8 2>/dev/null | awk -F'/' '/rtt/{printf "%.2f", $5}')
          LATENCY_1111=$(ping -c 5 -W 3 1.1.1.1 2>/dev/null | awk -F'/' '/rtt/{printf "%.2f", $5}')
          [ -z "$LATENCY_8888" ] && LATENCY_8888="timeout"
          [ -z "$LATENCY_1111" ] && LATENCY_1111="timeout"

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "$TIMESTAMP | 8.8.8.8=${LATENCY_8888}ms | 1.1.1.1=${LATENCY_1111}ms" >> activity.log

          # Keep log from growing unbounded
          tail -500 activity.log > activity.log.tmp && mv activity.log.tmp activity.log

          # Persist updated run count
          RUNS_TODAY=$((RUNS_TODAY + 1))
          echo "$TODAY:$RUNS_TODAY:$TARGET" > "$COUNT_FILE"

          git config user.name  "Cliff"
          git config user.email "16766408+sdncoder@users.noreply.github.com"

          git add activity.log "$COUNT_FILE"
          git commit -m "chore: latency update [$TIMESTAMP]"
          git push
